    <!-- Meta match-quality upgrades (external_id, country, value/currency on Lead, ViewContent on engagement) -->
    <script>
    (function(){
      var XKEY='shalem_xid';
      function uuid(){if(crypto&&crypto.randomUUID)return crypto.randomUUID();return'xxxxxxxxxxxx4xxxyxxxxxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=(Math.random()*16)|0;return(c==='x'?r:(r&0x3)|0x8).toString(16)})}
      var xid;try{xid=localStorage.getItem(XKEY);if(!xid){xid=uuid();localStorage.setItem(XKEY,xid)}}catch(_){xid=uuid()}
      window.__shalemXid=xid;
      // Neutralize legacy browser-only fireMetaLead — CAPI relay handles Lead with deduped server-side mirror.
      window.fireMetaLead=function(){};
      function ready(cb){if(window.shalemCapi&&window.shalemCapi.fire)return cb();var t=0,iv=setInterval(function(){t++;if(window.shalemCapi&&window.shalemCapi.fire){clearInterval(iv);cb()}else if(t>60){clearInterval(iv)}},50)}
      ready(function(){
        // Wrap fire(): auto-inject external_id+country on every event; merge value/currency/content fields on Lead.
        var orig=window.shalemCapi.fire;
        window.shalemCapi.fire=function(name,user,custom){
          user=user||{};custom=custom||{};
          if(!user.external_id)user.external_id=xid;
          if(!user.country)user.country='US';
          if(name==='Lead'){
            if(custom.value==null)custom.value=75;
            if(!custom.currency)custom.currency='USD';
            if(!custom.content_category)custom.content_category='home_care';
            if(!custom.content_type)custom.content_type='lead_form';
            if(!custom.content_name)custom.content_name='main_site_consultation';
          }
          return orig.call(window.shalemCapi,name,user,custom);
        };
        // ViewContent = engaged-session signal. Fires after 6s OR when user reaches the contact section.
        var vcFired=false;
        function fireVC(reason){if(vcFired)return;vcFired=true;window.shalemCapi.fire('ViewContent',{},{content_name:'consultation_page',content_category:'home_care',content_type:'main_site',source:reason})}
        setTimeout(function(){fireVC('engaged_6s')},6000);
        function checkScroll(){var c=document.getElementById('contact')||document.querySelector('form');if(!c)return;var r=c.getBoundingClientRect();if(r.top<window.innerHeight*0.75){fireVC('scroll_to_contact');window.removeEventListener('scroll',checkScroll)}}
        window.addEventListener('scroll',checkScroll,{passive:true});
      });
    })();
